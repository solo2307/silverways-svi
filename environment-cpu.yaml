name: silverways-cpu

channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.11.4

  # PyTorch stack
  - pytorch=2.4.1
  - torchvision=0.19.1
  - cpuonly

  # Core Python/data
  - numpy=1.26.4
  - scipy
  - pip
  - pyyaml
  - setuptools
  - cmake
  - ninja

  # Image processing
  - pillow
  - matplotlib
  - opencv

  - pip:
      # Package/CLI
      - typer==0.17.4
      - rich>=13.0.0
      - tqdm>=4.66.1

      # Model downloads / HF models
      - huggingface_hub>=0.23.0
      - transformers==4.45.2
      - accelerate>=0.33.0
      - safetensors>=0.4.0

      # YOLO / SAM / SAM2
      - ultralytics>=8.3.237

      # PSPNet / MIT semantic segmentation
      - mit-semseg==1.0.0

      # InternVL GGUF / llama.cpp
      - llama-cpp-python>=0.3.0

      # Optional config/env
      - python-dotenv>=1.0.0