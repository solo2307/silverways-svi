input_dir: /Users/yulia.grinblat/Documents/Git_repos/SilverWays/data-ingestion/cache/cyclomedia
output_dir: outputs/pspnet
recursive: true
limit: 4
device: auto

model:
  hf_repo_id: solo2307/pspnet_svi_veg
  local_dir: models/pspnet_svi_veg
  files:
    - encoder_epoch_50.pth
    - decoder_epoch_50.pth
    - color150.mat
    - color150-labels.txt
  encoder: resnet101
  decoder: upernet
  fc_dim: 2048
  num_class: 150
  img_sizes: [ 300, 400, 500, 600 ]
  img_max_size: 1000
  padding_constant: 8
  segm_downsampling_rate: 8


outputs:
  save_color_mask: false
  save_raw_prediction: true
  save_visualization: true
  save_metrics_csv: true
