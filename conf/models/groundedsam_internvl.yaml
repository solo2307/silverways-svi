# conf/models/groundedsam_internvl.yaml

input_dir: /mnt/sds-hd/sd17f001/ygrin/silverways/ZeroShotEval/mannheim
#/mnt/sds-hd/sd17f001/ygrin/silverways/ZeroShotEval
output_dir:  outputs/groundedsam_internvl
#/mnt/sds-hd/sd17f001/ygrin/silverways/outputs/groundedsam_internvl
recursive: false
limit: 1
device: auto

crop_padding_ratio: 0.15
use_masked_crop: true

grounding_dino:
  name_or_path: IDEA-Research/grounding-dino-tiny
  local_dir: models/grounding_dino_tiny

sam2:
  weights: models/sam2_b.pt
  imgsz: 1024

prompt:
  text_labels:
    - sidewalk
    - pedestrian walkway
    - footway
  box_threshold: 0.35
  text_threshold: 0.25

internvl:
  model_path: models/internvl/InternVL3-8B-Q4_K_M.gguf
  mmproj_path: models/internvl/mmproj-BF16.gguf
  n_ctx: 8192
  n_gpu_layers: -1
  verbose: false

outputs:
  save_json: true
  save_masks: true
  save_annotated: true
  save_crops: true