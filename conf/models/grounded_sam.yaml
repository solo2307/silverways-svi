input_dir: data/pano
output_dir: outputs/grounded_sam
recursive: false
limit: null
device: cuda

grounding_dino:
  name_or_path: IDEA-Research/grounding-dino-tiny
  local_dir: models/grounding_dino_tiny

sam2:
  weights: models/sam2_b.pt
  imgsz: 1024

prompt:
  text_labels:
    - tree
    - grass
    - bush
  box_threshold: 0.35
  text_threshold: 0.25

outputs:
  save_json: true
  save_masks: true
  save_annotated: true