defaults:
  - _self_
  - datasets/streetview_config
  - datasets/ohsome_config
  - indictors/ind_config

#  Hydra parameters
hydra:
  run:
    dir: ./outputs/${hydra.job.name}/${now:%Y-%m-%d_%H-%M-%S}
# Credentials for SilverWays DataBases and OHSOME API
minio:
  ohsome_account: ${oc.env:OHSOME_MINIO_ACCESS_ID}
  ohsome_key:  ${oc.env:OHSOME_MINIO_ACCESS_KEY}
  endpoint: "hot.storage.heigit.org"
  silverways_account:  ${oc.env:HOT_MINIO_ACCESS_ID}
  silverways_key:  ${oc.env:HOT_MINIO_ACCESS_KEY}
  bucket_name: "heigit-silverways"
  folder_name: "mannheim/google-streetview"

# Credentials to Google Earth Engine and Google Cloud Platform
gee:
  project_id: "aa-automatization"
gcp:
  service_key: ${oc.env:GOOGLE_API_KEY_JOH}

# Local Storage
storage:
  cache: 'cache'
  sds: '/Volumes/sd17f001/ygrin/silverways/mannheim'
