name: silverways-gpu

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11.4

  # GPU PyTorch stack.
  # Keep torch + torchvision + CUDA from conda together.
  - pytorch=2.1.2
  - torchvision=0.16.2
  - pytorch-cuda=12.1

  # Core Python/data
  - numpy
  - scipy
  - pip
  - pyyaml
  - setuptools

  # Image processing
  - pillow
  - matplotlib
  - opencv

  - pip:
      # Package/CLI
      - typer==0.17.4
      - rich>=13.0.0
      - tqdm>=4.66.1

      # Model downloads / Hugging Face models
      - huggingface_hub>=0.23.0
      - transformers>=4.45.0
      - accelerate>=0.33.0
      - safetensors>=0.4.0

      # YOLO / SAM / SAM2
      - ultralytics>=8.3.237

      # PSPNet / MIT semantic segmentation
      - mit-semseg==1.0.0

      # Optional env variables
      - python-dotenv>=1.0.0